<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotador WA - Nichos</title>
<style>
  :root{
    --bg:#0B141A; --panel:#111B21; --panel2:#1A252C; --border:#22313A;
    --text:#E9EDEF; --muted:#8696A0; --green:#25D366; --green-dark:#128C5E;
    --amber:#F5B942; --red:#F26D6D;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 16px 80px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
  h1 span{color:var(--green)}
  .user-info{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  .user-avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#062E1C;display:flex;align-items:center;justify-content:center;font-weight:700}
  .btn{background:var(--green);color:#062E1C;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn.ghost:hover{border-color:var(--green);color:var(--green)}
  .btn.small{padding:6px 12px;font-size:12px;border-radius:6px}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--border)}
  .btn.danger:hover{border-color:var(--red);background:rgba(242,109,109,.1)}

  .nichos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-bottom:20px}
  .nicho-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;transition:all .2s}
  .nicho-card:hover{border-color:var(--green);box-shadow:0 0 20px rgba(37,211,102,.1)}
  .nicho-head{margin-bottom:16px}
  .nicho-nombre{font-size:18px;font-weight:700;color:var(--green);margin-bottom:4px}
  .link-maestro-box{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px}
  .link-maestro-label{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;margin-bottom:6px;display:block}
  .link-maestro{display:flex;gap:8px;align-items:center}
  .link-maestro-text{flex:1;font-family:var(--mono);font-size:12px;color:var(--green);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link-maestro button{flex-shrink:0;padding:4px 10px}

  .umbral-control{background:var(--panel2);border-radius:8px;padding:12px;margin-bottom:14px}
  .umbral-label{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;margin-bottom:6px;display:block}
  .umbral-row{display:flex;gap:8px;align-items:center}
  .umbral-row input{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px}
  .umbral-row input:focus{outline:none;border-color:var(--green)}
  .umbral-row button{padding:6px 12px;font-size:12px}

  .grupos-list{margin-bottom:12px}
  .grupo-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;transition:all .2s}
  .grupo-item:hover{border-color:var(--green)}
  .grupo-info{flex:1;min-width:0}
  .grupo-label{font-size:12px;color:var(--muted);margin-bottom:4px}
  .grupo-url{font-family:var(--mono);font-size:11px;color:var(--green);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .grupo-barra{height:5px;background:var(--bg);border-radius:99px;margin-top:6px;overflow:hidden;min-width:60px}
  .grupo-barra i{display:block;height:100%;background:var(--green);border-radius:99px}
  .grupo-barra i.full{background:var(--red)}
  .grupo-clics{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
  .grupo-estado{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-bottom:4px}
  .grupo-estado.activo{background:rgba(37,211,102,.15);color:var(--green)}
  .grupo-estado.lleno{background:rgba(242,109,109,.15);color:var(--red)}
  .grupo-estado.cola{background:rgba(134,150,160,.15);color:var(--muted)}
  .grupo-acciones{display:flex;flex-direction:column;gap:4px}
  .grupo-acciones button{padding:4px 8px;font-size:11px;width:60px}

  .nicho-actions{display:flex;gap:8px;margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
  .nicho-actions button{flex:1}

  .add-nicho{text-align:center;padding:40px 20px}
  .add-nicho button{font-size:16px;padding:14px 24px}

  .auth-form{max-width:400px;margin:20vh auto;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:40px 30px}
  .auth-form h1{margin-bottom:8px}
  .auth-form .subtitle{color:var(--muted);font-size:14px;margin-bottom:28px}
  .auth-form input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:8px;font-size:14px;margin-bottom:12px}
  .auth-form input:focus{outline:none;border-color:var(--green)}
  .auth-form .btn{width:100%;margin-bottom:14px}
  .auth-form .toggle{color:var(--muted);font-size:13px;margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
  .auth-form .toggle a{color:var(--green);cursor:pointer;text-decoration:underline}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#062E1C;padding:10px 18px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
  .toast.show{opacity:1}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
  .modal h2{font-size:18px;margin-bottom:4px;color:var(--text)}
  .modal p{color:var(--muted);font-size:13px;margin-bottom:16px}
  .modal label{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px;font-weight:600;text-transform:uppercase}
  .modal input,.modal textarea{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-size:13px;font-family:inherit;margin-bottom:12px}
  .modal input:focus,.modal textarea:focus{outline:none;border-color:var(--green)}
  .modal textarea{min-height:100px;resize:vertical;font-family:var(--mono);font-size:12px}
  .modal-footer{display:flex;gap:8px;margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
  .modal-footer button{flex:1}
  .modal-footer .ghost{flex:1.2}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty p{margin-bottom:20px;font-size:14px}

  .tutorial-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;backdrop-filter:blur(2px)}
  .tutorial-modal.hidden{display:none}
  .tutorial-slide{background:var(--panel);border:2px solid var(--green);border-radius:14px;padding:40px;width:100%;max-width:600px;text-align:center;animation:slideIn .3s}
  @keyframes slideIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
  .tutorial-slide h2{font-size:28px;color:var(--green);margin-bottom:12px}
  .tutorial-slide .step-number{display:inline-block;background:var(--green);color:#062E1C;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700;margin-bottom:16px}
  .tutorial-slide p{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:20px}
  .tutorial-slide .icon{font-size:60px;margin-bottom:16px}
  .tutorial-controls{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
  .tutorial-controls button{min-width:120px}
  .tutorial-progress{display:flex;gap:6px;justify-content:center;margin-top:20px}
  .tutorial-progress span{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .2s}
  .tutorial-progress span.active{background:var(--green);width:24px;border-radius:4px}

  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
  .tab-btn{padding:12px 18px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;border-bottom:2px solid transparent;transition:all .2s}
  .tab-btn.active{color:var(--green);border-bottom-color:var(--green)}
  .tab-btn:hover{color:var(--text)}

  .colab-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .colab-email{font-size:13px;color:var(--text)}
  .colab-nombre{font-size:11px;color:var(--muted)}

  @media(max-width:720px){
    .nichos-grid{grid-template-columns:1fr}
    .grupo-acciones{flex-direction:row;width:100%}
    .grupo-acciones button{flex:1}
    .tutorial-slide{padding:30px 20px}
    .tutorial-slide h2{font-size:22px}
    .tutorial-slide .icon{font-size:48px}
  }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal"></div>
<div class="tutorial-modal hidden" id="tutorial"></div>

<script>
const $ = s => document.querySelector(s);
const app = $("#app");
const modal = $("#modal");
const tutorial = $("#tutorial");
let nichos = [];
let usuarioActual = null;
let tutorialStep = 0;
let colaboradores = [];

const tutorialSteps = [
  {icon:"🎯",title:"Bienvenido",text:"Aquí gestionás todos tus Nichos (categorías) y sus grupos de WhatsApp",cta:"Siguiente"},
  {icon:"📂",title:"¿Qué es un Nicho?",text:"Un Nicho es una categoría (Ej: dinero, bajar de peso, recetas). Cada uno tiene su propio link maestro que rota entre grupos.",cta:"Siguiente"},
  {icon:"🔗",title:"Link Maestro",text:"El link que compartes con tus clientes. Cuando se llena un grupo, automáticamente rota al siguiente. ¡Un solo link para todos!",cta:"Siguiente"},
  {icon:"⚡",title:"Umbral de Clics",text:"Es a cuántos clics se llena un grupo y rota. Si cada 100 clics entran ~70 personas, para 1024 miembros pon 1350 clics.",cta:"Siguiente"},
  {icon:"👥",title:"Agregar Grupos",text:"Pega todos los links de WhatsApp de tus grupos. Pueden ser de una vez (uno por línea). El sistema se encarga de rotar automáticamente.",cta:"Siguiente"},
  {icon:"✅",title:"¡Listo!",text:"Ya sabés cómo usar. Crea tu primer nicho y agregá tus grupos. El link maestro empieza a rotar automáticamente.",cta:"Entendido"}
];

// ---------- API ----------
async function api(url, opts={}){
  const r = await fetch(url,{headers:{"Content-Type":"application/json"},...opts});
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ toast(d.error||"Error"); throw new Error(d.error); }
  return d;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
function copiar(txt){ navigator.clipboard.writeText(txt); toast("Copiado"); }

// ---------- TUTORIAL ----------
function renderTutorialStep(){
  const step = tutorialSteps[tutorialStep];
  const progress = Array.from({length:tutorialSteps.length}, (_, i) =>
    `<span class="${i === tutorialStep ? 'active' : ''}"></span>`
  ).join('');
  tutorial.innerHTML = `
    <div class="tutorial-slide">
      <div class="step-number">Paso ${tutorialStep + 1} de ${tutorialSteps.length}</div>
      <div class="icon">${step.icon}</div>
      <h2>${step.title}</h2>
      <p>${step.text}</p>
      <div class="tutorial-controls">
        ${tutorialStep > 0 ? `<button class="btn ghost" onclick="prevTutorial()">← Atrás</button>` : ''}
        <button class="btn" onclick="nextTutorial()">${step.cta}</button>
      </div>
      <div class="tutorial-progress">${progress}</div>
    </div>
  `;
}
function nextTutorial(){
  if(tutorialStep < tutorialSteps.length - 1){
    tutorialStep++;
    renderTutorialStep();
  } else {
    closeTutorial();
  }
}
function prevTutorial(){
  if(tutorialStep > 0){
    tutorialStep--;
    renderTutorialStep();
  }
}
function abrirTutorial(){
  tutorialStep = 0;
  renderTutorialStep();
  tutorial.classList.remove("hidden");
}
function closeTutorial(){
  tutorial.classList.add("hidden");
  localStorage.setItem("tutorialVisto", "true");
}
function verificarTutorial(){
  const visto = localStorage.getItem("tutorialVisto");
  if(!visto) setTimeout(() => abrirTutorial(), 800);
}

// ---------- AUTH ----------
function renderLogin(){
  app.innerHTML = `
    <div class="auth-form">
      <h1>Rotador <span style="color:var(--green)">WA</span></h1>
      <p class="subtitle" id="subtitle">Inicia sesión para continuar</p>
      <div id="formContent"></div>
    </div>
  `;
  mostrarLogin();
}

function mostrarLogin(){
  document.getElementById("formContent").innerHTML = `
    <input type="email" id="email" placeholder="Email" autofocus>
    <input type="password" id="password" placeholder="Contraseña">
    <button class="btn" onclick="login()" style="width:100%">Entrar</button>
    <div class="toggle">¿No tenés cuenta? <a onclick="mostrarRegistro()">Crear una</a></div>
  `;
  document.getElementById("email").addEventListener("keydown", e => { if(e.key==="Enter") login(); });
}

function mostrarRegistro(){
  document.getElementById("subtitle").textContent = "Crear nueva cuenta";
  document.getElementById("formContent").innerHTML = `
    <input type="text" id="nombre" placeholder="Tu nombre" autofocus>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Contraseña (mín. 6 caracteres)">
    <button class="btn" onclick="register()" style="width:100%">Registrarse</button>
    <div class="toggle">¿Ya tenés cuenta? <a onclick="mostrarLogin()">Inicia sesión</a></div>
  `;
  document.getElementById("nombre").addEventListener("keydown", e => { if(e.key==="Enter") register(); });
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if(!email || !password) return toast("Completa los campos");
  await api("/api/login",{method:"POST",body:JSON.stringify({email,password})});
  cargar();
}

async function register(){
  const nombre = document.getElementById("nombre").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if(!nombre || !email || !password) return toast("Completa todos los campos");
  if(password.length < 6) return toast("Contraseña mínimo 6 caracteres");
  await api("/api/register",{method:"POST",body:JSON.stringify({nombre,email,password})});
  cargar();
}

// ---------- MAIN ----------
async function cargar(){
  try {
    usuarioActual = await api("/api/me");
    nichos = await api("/api/listas");
    colaboradores = await api("/api/colaboradores");
    renderPanel();
    verificarTutorial();
  } catch(e) {
    renderLogin();
  }
}

function renderPanel(){
  const initial = usuarioActual.nombre.charAt(0).toUpperCase();
  app.innerHTML = `
    <header>
      <h1>Rotador <span>WA</span></h1>
      <div style="display:flex;gap:12px;align-items:center">
        <div class="user-info">
          <div class="user-avatar">${initial}</div>
          <div>
            <div>${usuarioActual.nombre}</div>
            <div style="font-size:11px">${usuarioActual.email}</div>
          </div>
        </div>
        <button class="btn ghost small" onclick="abrirTutorial()">💡 Tutorial</button>
        <button class="btn ghost small" onclick="abrirColaboradores()">👥 Colaboradores</button>
        <button class="btn small" onclick="logout()">Salir</button>
      </div>
    </header>
    <div id="nichos"></div>
  `;

  const nichos_div = $("#nichos");
  if(!nichos.length){
    nichos_div.innerHTML = `
      <div class="empty">
        <p>No tenés nichos aún</p>
        <button class="btn" onclick="abrirModalNicho()">+ Crear Nicho</button>
      </div>
    `;
  } else {
    nichos_div.innerHTML = `
      <div class="nichos-grid" id="grid"></div>
      <div style="text-align:center;margin-top:24px">
        <button class="btn" onclick="abrirModalNicho()">+ Nuevo Nicho</button>
      </div>
    `;
    const grid = $("#grid");
    nichos.forEach(n => grid.appendChild(renderNicho(n)));
  }
}

function renderNicho(n){
  const card = document.createElement("div");
  card.className = "nicho-card";
  const linkMaestro = `${window.location.origin}/r/${n.slug}`;
  const progreso = Math.min(100, Math.round((n.total_clics / n.umbral) * 100));

  card.innerHTML = `
    <div class="nicho-head">
      <div class="nicho-nombre">${n.nombre}</div>
      <div class="grupo-estado ${n.grupos && n.grupos[0]?.estado || 'cola'}">${n.grupos && n.grupos[0]?.estado || 'cola'}</div>
    </div>
    <div class="link-maestro-box">
      <span class="link-maestro-label">🔗 Link Maestro</span>
      <div class="link-maestro">
        <span class="link-maestro-text">${linkMaestro}</span>
        <button class="btn small" onclick="copiar('${linkMaestro}')">Copy</button>
      </div>
    </div>
    <div class="umbral-control">
      <span class="umbral-label">⚡ Clics para rotar: ${n.umbral}</span>
      <div class="umbral-row">
        <input type="number" id="umbral_${n.id}" value="${n.umbral}" min="100" max="5000" step="50">
        <button class="btn small" onclick="guardarUmbral(${n.id})">Guardar</button>
      </div>
    </div>
    <div class="grupos-list" id="grupos_${n.id}"></div>
    <div class="nicho-actions">
      <button class="btn small" onclick="abrirModalGrupos(${n.id})">+ Agregar Grupos</button>
      <button class="btn small ghost" onclick="editarNicho(${n.id})">Editar</button>
      <button class="btn small danger" onclick="borrarNicho(${n.id})">Borrar</button>
    </div>
  `;

  const grupos_div = card.querySelector(`#grupos_${n.id}`);
  if(n.grupos && n.grupos.length){
    n.grupos.forEach((g,i) => {
      const prog = Math.min(100, Math.round((g.clics / n.umbral) * 100));
      const item = document.createElement("div");
      item.className = "grupo-item";
      item.innerHTML = `
        <div class="grupo-info">
          <div class="grupo-estado ${g.estado}">${g.estado}</div>
          <div class="grupo-label">${g.etiqueta || `Grupo ${i+1}`}</div>
          <div class="grupo-url">${g.url}</div>
          <div class="grupo-barra"><i style="width:${prog}%" class="${prog >= 100 ? 'full' : ''}"></i></div>
        </div>
        <div class="grupo-clics" style="flex-shrink:0">
          <div>${g.clics}/${n.umbral}</div>
          <div style="font-size:10px;margin-top:4px">
            <button class="btn small ghost" onclick="accionGrupo(${g.id},'${g.estado === 'lleno' ? 'reabrir' : 'lleno'}')">
              ${g.estado === 'lleno' ? 'Reabrir' : 'Llenar'}
            </button>
            <button class="btn small ghost" onclick="resetGrupo(${g.id})" style="margin-top:4px">Reset</button>
            <button class="btn small danger" onclick="borrarGrupo(${g.id})" style="margin-top:4px">Del</button>
          </div>
        </div>
      `;
      grupos_div.appendChild(item);
    });
  }
  return card;
}

async function guardarUmbral(id){
  const val = document.querySelector(`#umbral_${id}`).value;
  if(!val || val < 100) return toast("Mínimo 100 clics");
  await api(`/api/listas/${id}`,{method:"PATCH",body:JSON.stringify({umbral:parseInt(val)})});
  nichos = await api("/api/listas");
  renderPanel();
  toast("Umbral actualizado");
}

async function accionGrupo(id, accion){
  await api(`/api/grupos/${id}`,{method:"PATCH",body:JSON.stringify({accion})});
  nichos = await api("/api/listas");
  renderPanel();
}

async function resetGrupo(id){
  if(!confirm("¿Resetear clics de este grupo?")) return;
  await api(`/api/grupos/${id}`,{method:"PATCH",body:JSON.stringify({accion:"reset_clics"})});
  nichos = await api("/api/listas");
  renderPanel();
}

async function borrarGrupo(id){
  if(!confirm("¿Borrar este grupo?")) return;
  await api(`/api/grupos/${id}`,{method:"DELETE"});
  nichos = await api("/api/listas");
  renderPanel();
}

function abrirModalNicho(){
  modal.innerHTML = `
    <div class="modal">
      <h2>Crear Nicho</h2>
      <p>Ej: dinero, bajar de peso, recetas</p>
      <label>Nombre</label>
      <input type="text" id="nombre_nicho" placeholder="Ej: Dinero">
      <label>URL Fallback (opcional)</label>
      <input type="url" id="fallback" placeholder="Link si todos los grupos se llenan">
      <div class="modal-footer">
        <button class="btn ghost" onclick="modal.classList.remove('open')">Cancelar</button>
        <button class="btn" onclick="crearNicho()">Crear</button>
      </div>
    </div>
  `;
  modal.classList.add("open");
  document.getElementById("nombre_nicho").focus();
}

async function crearNicho(){
  const nombre = document.getElementById("nombre_nicho").value.trim();
  if(!nombre) return toast("Falta el nombre");
  await api("/api/listas",{method:"POST",body:JSON.stringify({nombre,fallback_url:document.getElementById("fallback").value})});
  nichos = await api("/api/listas");
  renderPanel();
  modal.classList.remove("open");
}

function editarNicho(id){
  const n = nichos.find(x=>x.id===id);
  modal.innerHTML = `
    <div class="modal">
      <h2>Editar ${n.nombre}</h2>
      <label>Nombre</label>
      <input type="text" id="edit_nombre" value="${n.nombre}">
      <label>URL Fallback</label>
      <input type="url" id="edit_fallback" value="${n.fallback_url || ''}">
      <div class="modal-footer">
        <button class="btn ghost" onclick="modal.classList.remove('open')">Cancelar</button>
        <button class="btn" onclick="guardarEditNicho(${id})">Guardar</button>
      </div>
    </div>
  `;
  modal.classList.add("open");
}

async function guardarEditNicho(id){
  const nombre = document.getElementById("edit_nombre").value.trim();
  if(!nombre) return toast("Falta el nombre");
  await api(`/api/listas/${id}`,{method:"PATCH",body:JSON.stringify({nombre,fallback_url:document.getElementById("edit_fallback").value})});
  nichos = await api("/api/listas");
  renderPanel();
  modal.classList.remove("open");
}

async function borrarNicho(id){
  if(!confirm("¿Borrar este nicho y TODOS sus grupos?")) return;
  await api(`/api/listas/${id}`,{method:"DELETE"});
  nichos = await api("/api/listas");
  renderPanel();
}

function abrirModalGrupos(lista_id){
  modal.innerHTML = `
    <div class="modal">
      <h2>Agregar Grupos</h2>
      <p>Pega los links de WhatsApp (uno por línea)</p>
      <label>Links</label>
      <textarea id="urls_grupos" placeholder="https://chat.whatsapp.com/xxx&#10;https://chat.whatsapp.com/yyy&#10;https://chat.whatsapp.com/zzz" autofocus></textarea>
      <div class="modal-footer">
        <button class="btn ghost" onclick="modal.classList.remove('open')">Cancelar</button>
        <button class="btn" onclick="agregarGrupos(${lista_id})">Agregar</button>
      </div>
    </div>
  `;
  modal.classList.add("open");
  document.getElementById("urls_grupos").focus();
}

async function agregarGrupos(lista_id){
  const urls = document.getElementById("urls_grupos").value.trim();
  if(!urls) return toast("Pega al menos un link");
  await api(`/api/listas/${lista_id}/grupos`,{method:"POST",body:JSON.stringify({urls})});
  nichos = await api("/api/listas");
  renderPanel();
  modal.classList.remove("open");
  toast("Grupos agregados");
}

function abrirColaboradores(){
  modal.innerHTML = `
    <div class="modal">
      <h2>👥 Colaboradores</h2>
      <p>Gestiona quién tiene acceso a tus nichos</p>
      <div class="colaboradores-list" id="colab_list"></div>
      <label style="margin-top:20px">Agregar Colaborador</label>
      <input type="email" id="colab_email" placeholder="Email del colaborador">
      <div class="modal-footer">
        <button class="btn ghost" onclick="modal.classList.remove('open')">Cerrar</button>
        <button class="btn" onclick="agregarColaborador()">Agregar</button>
      </div>
    </div>
  `;
  modal.classList.add("open");
  renderColaboradores();
}

function renderColaboradores(){
  const list = document.getElementById("colab_list");
  if(!colaboradores.length){
    list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">Sin colaboradores aún</p>';
  } else {
    list.innerHTML = colaboradores.map(c => `
      <div class="colab-item">
        <div>
          <div class="colab-email">${c.email}</div>
          <div class="colab-nombre">${c.nombre}</div>
        </div>
        <button class="btn small danger" onclick="quitarColaborador(${c.id})">Quitar</button>
      </div>
    `).join('');
  }
}

async function agregarColaborador(){
  const email = document.getElementById("colab_email").value.trim();
  if(!email) return toast("Ingresa un email");
  await api("/api/colaboradores",{method:"POST",body:JSON.stringify({email})});
  colaboradores = await api("/api/colaboradores");
  renderColaboradores();
  document.getElementById("colab_email").value = "";
  toast("Colaborador agregado");
}

async function quitarColaborador(id){
  if(!confirm("¿Remover este colaborador?")) return;
  await api(`/api/colaboradores/${id}`,{method:"DELETE"});
  colaboradores = await api("/api/colaboradores");
  renderColaboradores();
}

async function logout(){
  await api("/api/logout",{method:"POST"});
  renderLogin();
}

// INIT
cargar();
</script>
</body>
</html>
